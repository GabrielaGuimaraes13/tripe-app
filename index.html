<style>
  :root{
    --bg:#FAF6EE; --ink:#2A241C; --primary:#21402E; --primary-dark:#162C1F;
    --accent:#D97A3D; --accent-soft:#FCEFDD; --blue:#4E8FB5; --blue-soft:#DCEBF2;
    --gold:#E3A72B; --gold-soft:#F5E6BE; --pink:#D9678C; --pink-soft:#F6D9E2;
    --muted:#8A8070; --line:#EDE4CF; --line2:#E3D9BF; --good:#4F7A5A; --bad:#C1543E;
    --card:#FFFFFF; --display:'Fraunces',serif; --body:'Public Sans',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);}
  h1,h2,h3{font-family:var(--display); margin:0;}
  button{font-family:var(--body); cursor:pointer;}
  ul{list-style:none; margin:0; padding:0;}

  /* HEADER (curved hero) */
  .app-header{
    background:var(--primary); color:#fff; padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;
    border-radius:0 0 28px 28px; position:relative; overflow:hidden; flex:none;
  }
  .app-header.tall{padding-bottom:26px;}
  .header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .name{font-family:var(--display); font-weight:700; font-size:17px;}
  .docs-btn{background:rgba(255,255,255,.16); border:none; color:#fff; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .header-greeting{color:#CFE0D2; font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .header-title{font-size:21px; font-weight:700; color:#fff; margin:0 0 10px; line-height:1.2;}
  .header-simple-title{font-size:19px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px;}
  .date-pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent); padding:5px 13px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .day-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.18); border:none; color:#fff; width:30px; height:30px; border-radius:50%; font-size:15px; display:flex; align-items:center; justify-content:center;}
  .day-nav.prev{left:14px;} .day-nav.next{right:14px;}
  .day-nav:disabled{opacity:.25;}
  .deco-path{position:absolute; right:18px; bottom:10px; opacity:.3; pointer-events:none;}

  main{flex:1; overflow-y:auto; padding-bottom:86px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .inner{padding:20px 18px 4px; max-width:600px; margin:0 auto;}

  #app{display:flex; flex-direction:column; height:100vh;}

  /* BOTTOM NAV */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; background:var(--bg);
    border-top:1px solid var(--line); padding:8px 6px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .navbtn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 2px; color:#C7BDA0; font-size:10px; font-weight:600;}
  .navbtn .ic{font-size:18px;}
  .navbtn.active{color:var(--primary); font-weight:700;}

  .card{background:var(--card); border-radius:18px; padding:16px; box-shadow:0 4px 14px rgba(33,64,46,.07); margin-bottom:14px;}
  .section-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px;}

  /* TIMELINE (Hoje) */
  .loc-line{color:var(--muted); font-size:13px; margin:-2px 0 16px; text-align:center;}
  .timeline{position:relative; margin-top:6px;}
  .timeline::before{content:""; position:absolute; left:50%; top:6px; bottom:6px; width:3px; background:var(--line2); transform:translateX(-50%); border-radius:3px;}
  .timeline .fill{position:absolute; left:50%; top:6px; width:3px; background:var(--good); transform:translateX(-50%); border-radius:3px; transition:height .3s;}
  .trow{display:flex; align-items:center; margin-bottom:10px; min-height:60px; position:relative;}
  .trow .side{flex:1;}
  .trow .side.left{text-align:right; padding-right:16px;}
  .trow .side.right{text-align:left; padding-left:16px;}
  .tbadge{flex:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; z-index:1; box-shadow:0 0 0 5px var(--bg); cursor:pointer;}
  .tcard{display:inline-block; background:#fff; border-radius:16px; padding:11px 14px; max-width:155px; box-shadow:0 4px 12px rgba(33,64,46,.08); cursor:pointer;}
  .tcard.done{opacity:.5;}
  .tcard .nm{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tcard.done .nm{text-decoration:line-through; color:var(--muted);}
  .tcard .flag{font-size:9.5px; font-weight:800; margin-top:3px; letter-spacing:.02em;}

  .empty-note{color:var(--muted); font-size:14px; text-align:center; padding:34px 10px;}

  /* MAPA */
  .map-wrap{position:relative; padding:16px 0 40px;}
  .blob{position:absolute; border-radius:50%; opacity:.5; pointer-events:none;}
  .mstop{position:absolute; text-align:center;}
  .mstop .circ{border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.12); margin:0 auto;}
  .mstop.current .circ{box-shadow:0 0 0 6px var(--accent-soft), 0 4px 10px rgba(217,122,61,.4);}
  .mstop .car{position:absolute; right:-4px; bottom:-4px; width:24px; height:24px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .mstop .lbl{font-size:10px; font-weight:700; color:#5C5647; margin-top:5px; width:90px; margin-left:-27px;}
  .mstop.current .lbl{color:var(--accent); font-weight:800; font-size:11px;}
  .mstop .here{font-size:9px; font-weight:700; color:var(--muted); margin-top:1px;}

  /* EXTRAS */
  .extras-tabs{display:flex; gap:7px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .extras-tabs button{background:#fff; border:1.5px solid var(--line2); padding:7px 14px; border-radius:999px; font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}
  .extras-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:9px 13px; border-radius:999px; font-size:12.5px; font-weight:700;}
  .chip select{border:none; background:transparent; font-family:var(--body); font-weight:700; font-size:11px; color:inherit; padding:0; margin-left:2px;}
  .fab{position:fixed; right:20px; bottom:92px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:24px; box-shadow:0 4px 14px rgba(217,122,61,.4); z-index:41;}

  /* FINANCEIRO */
  .balance-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .balance-row:last-child{border-bottom:none;}
  .balance-row .amt.pos{color:var(--good); font-weight:800;}
  .balance-row .amt.neg{color:var(--bad); font-weight:800;}
  .exp-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .exp-item:last-child{border-bottom:none;}
  .exp-item .d{color:var(--muted); font-size:11px;}

  /* MEMORIA */
  .lock-screen{text-align:center; padding:44px 20px;}
  .lock-screen .icon{font-size:40px; margin-bottom:12px;}
  .lock-screen h3{font-size:18px; color:var(--primary); margin-bottom:8px;}
  .lock-screen p{color:var(--muted); font-size:13.5px; line-height:1.5;}
  .mem-entry{background:#fff; border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 4px 12px rgba(33,64,46,.08);}
  .mem-entry img{width:100%; border-radius:12px; margin-bottom:8px;}
  .mem-entry .dt{font-size:11px; color:var(--accent); font-weight:800; text-transform:uppercase;}
  .mem-entry .txt{font-size:14px; margin-top:5px;}

  /* FORM */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:11px 13px; border:1.5px solid var(--line2); border-radius:12px; font-family:var(--body); font-size:14.5px; background:#fff;}
  .field textarea{resize:vertical; min-height:60px;}
  .btn{background:var(--primary); color:#fff; border:none; padding:13px 18px; border-radius:999px; font-weight:700; font-size:14.5px; width:100%;}

  /* SHEET */
  .sheet-overlay{position:fixed; inset:0; background:rgba(30,25,15,.5); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:600px; border-radius:24px 24px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:82vh; overflow-y:auto;}
  .sheet-handle{width:40px; height:4px; background:var(--line2); border-radius:4px; margin:0 auto 16px;}
  .sheet-title{font-family:var(--display); font-size:19px; font-weight:700; margin-bottom:14px; color:var(--primary);}
  .doc-block{background:#fff; border-radius:16px; padding:13px 15px; margin-bottom:10px; box-shadow:0 3px 10px rgba(33,64,46,.06);}
  .doc-block.today{background:var(--accent-soft); box-shadow:0 3px 10px rgba(217,122,61,.15);}
  .doc-block .dtitle{font-weight:700; font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
  .doc-block .drow{font-size:12.5px; color:var(--ink); margin-top:3px;}
  .today-flag{font-size:9.5px; background:var(--accent); color:#fff; padding:2px 8px; border-radius:999px; font-weight:700;}
</style>
</head>
<body>
<div id="app">

<header class="app-header tall" id="appHeader">
  <div class="header-top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="#fff"/><circle cx="12" cy="10" r="3" fill="#D97A3D"/></svg>
      <span class="name">Tripê</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="docs-btn" id="editBtn" onclick="toggleEditMode()" style="display:none;">✏️</button>
      <button class="docs-btn" onclick="openDocs()">📁</button>
    </div>
  </div>
  <div id="headerBody"></div>
</header>

<main>
  <section id="screen-hoje" class="screen active"></section>
  <section id="screen-mapa" class="screen"></section>
  <section id="screen-extras" class="screen"></section>
  <section id="screen-financeiro" class="screen"></section>
  <section id="screen-memoria" class="screen"></section>
</main>

<button class="fab" id="fabExtra" style="display:none" onclick="openAddExtra()">+</button>

<nav class="bottomnav">
  <button class="navbtn active" data-tab="hoje" onclick="switchTab('hoje')"><span class="ic">✅</span>Hoje</button>
  <button class="navbtn" data-tab="mapa" onclick="switchTab('mapa')"><span class="ic">🗺️</span>Mapa</button>
  <button class="navbtn" data-tab="extras" onclick="switchTab('extras')"><span class="ic">✨</span>Extras</button>
  <button class="navbtn" data-tab="financeiro" onclick="switchTab('financeiro')"><span class="ic">💰</span>Gastos</button>
  <button class="navbtn" data-tab="memoria" onclick="switchTab('memoria')"><span class="ic">📸</span>Memória</button>
</nav>
</div>

<!-- DOCUMENTOS SHEET -->
<div class="sheet-overlay" id="docsOverlay" onclick="if(event.target===this) closeDocs()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📁 Documentos da viagem</div>
    <div class="field"><input type="text" id="docSearch" placeholder="Buscar (ex: voo, hotel, carro...)" oninput="renderDocs()"></div>
    <div id="docsList"></div>
  </div>
</div>

<!-- ADD EXTRA SHEET -->
<div class="sheet-overlay" id="addExtraOverlay" onclick="if(event.target===this) closeAddExtra()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">✨ Adicionar em Extras</div>
    <div class="field"><label>Nome</label><input type="text" id="newExtraName" placeholder="Ex: Krispy Kreme"></div>
    <div class="field"><label>Categoria</label>
      <select id="newExtraCat">
        <option value="fastfood">🍔 Fast food</option>
        <option value="passeio">📍 Passeio / ponto turístico</option>
        <option value="outlet">🏬 Outlet / loja</option>
        <option value="outro">✨ Outro</option>
      </select>
    </div>
    <button class="btn" onclick="addExtra()">Adicionar</button>
  </div>
</div>

<!-- PARK ATTRACTIONS SHEET -->
<div class="sheet-overlay" id="parkOverlay" onclick="if(event.target===this) closeParkSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="parkSheetTitle"></div>
    <div id="parkSheetList"></div>
  </div>
</div>

function startFirebaseSync(){
  const setters = {
    done: v=>doneItems=v, parkDone: v=>parkDone=v, customItems: v=>customItems=v,
    extras: v=>extras=v, expenses: v=>expenses=v, memories: v=>memories=v,
  };
  Object.keys(setters).forEach(key=>{
    db.collection(FS_COLLECTION).doc(key).onSnapshot(snap=>{
      if(snap.exists){ setters[key](snap.data().value); }
      else { db.collection(FS_COLLECTION).doc(key).set({value: DEFAULTS[key]}); }
      refreshCurrentTab();
    }, err=>console.error("Firestore sync:", key, err));
  });
}

/* ================= HELPERS ================= */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function findTodayIndex(){
  const t = todayStr();
  let idx = DAYS.findIndex(d=>d.date===t);
  if(idx>=0) return idx;
  if(t < DAYS[0].date) return 0;
  return DAYS.length-1;
}
function fmtDate(iso){ const [y,m,d] = iso.split("-"); return d+"/"+m; }
function money(n){ return "US$ "+n.toFixed(2).replace(".",","); }
function pickEmoji(it, idx){
  if(it.emoji) return it.emoji;
  const cycle = ["🌟","📍","🕒","🎉"];
  return it.prio===0 ? "🌟" : it.prio===1 ? "📍" : "🕒";
}
function pickColor(idx){
  const cyc = ["#4F7A5A","#D97A3D","#4E8FB5","#E3A72B"];
  return cyc[idx % cyc.length];
}

/* ================= TAB SWITCH ================= */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+tab).classList.add("active");
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("fabExtra").style.display = tab==="extras" ? "flex" : "none";
  document.getElementById("editBtn").style.display = tab==="hoje" ? "flex" : "none";
  if(tab!=="hoje"){ editMode=false; document.getElementById("editBtn").style.background="rgba(255,255,255,.16)"; }
  const header = document.getElementById("appHeader");
  header.classList.toggle("tall", tab==="hoje");
  if(tab==="hoje") renderHoje();
  if(tab==="mapa") renderMapa();
  if(tab==="extras") renderExtras();
  if(tab==="financeiro") renderFinanceiro();
  if(tab==="memoria") renderMemoria();
}

/* ================= HOJE ================= */
let currentDayIdx = findTodayIndex();
function getDayItems(day){
  return customItems[day.date] ? customItems[day.date] : day.items;
}
function ensureCustom(day){
  if(!customItems[day.date]) customItems[day.date] = JSON.parse(JSON.stringify(day.items));
  return customItems[day.date];
}
function renderHoje(){
  const day = DAYS[currentDayIdx];
  const isPreview = todayStr() < DAYS[0].date;
  const isPast = todayStr() > DAYS[DAYS.length-1].date;
  const dayItems = getDayItems(day);
  const dayExtras = extras.filter(e=>e.day===day.date);
  const allItems = [...dayItems, ...dayExtras.map(e=>({name:e.name, prio:1, extra:true, emoji:e.emoji, fromExtras:true}))];
  const doneCount = allItems.filter((it,i)=>doneItems[day.date+"|"+i]).length;
  const pct = allItems.length ? (doneCount/allItems.length*100) : 0;

  document.getElementById("headerBody").innerHTML = `
    <button class="day-nav prev" onclick="changeDay(-1)" ${currentDayIdx===0?'disabled':''}>‹</button>

    <div class="date-pill">📍 ${day.wd.toUpperCase()} · ${fmtDate(day.date)}</div>
    <svg class="deco-path" width="60" height="34" viewBox="0 0 60 34"><path d="M2 28 Q20 4 58 12" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/></svg>
  `;

  let html = `<div class="inner">`;

  if(editMode) html += `<div style="text-align:center; font-size:12px; color:var(--accent); font-weight:700; margin-bottom:10px;">✏️ Modo edição — toque no ✕ pra remover</div>`;

  if(allItems.length===0 && !editMode){
    html += `<div class="empty-note">Nada programado — dia livre 🌤️</div>`;
  } else {
    html += `<div class="timeline"><div class="fill" style="height:${pct}%"></div>`;
    allItems.forEach((it,i)=>{
      const key = day.date+"|"+i;
      const isDone = !!doneItems[key];
      const side = i%2===0 ? "left" : "right";
      const emoji = isDone ? "✅" : pickEmoji(it,i);
      const badgeColor = isDone ? "var(--good)" : pickColor(i);
      const rot = (i%2===0 ? -1 : 1) * (i%3===0?1.4:0.6);
      let parkHint = "";
      if(it.isPark){
        const park = PARKS[it.parkKey];
        const doneCount = park.items.filter((pi,pidx)=>parkDone[it.parkKey+"|"+pidx]).length;
        parkHint = `<div class="flag" style="color:var(--accent)">${doneCount}/${park.items.length} atrações · toque pra ver →</div>`;
      }
      const isEditable = editMode && i < dayItems.length;
      const cardClick = editMode ? "" : (it.isPark ? `openParkSheet('${it.parkKey}')` : `toggleItem('${key}')`);
      const delBtn = isEditable ? `<button onclick="event.stopPropagation(); removeDayItem('${day.date}',${i})" style="position:absolute; top:-8px; ${side==='left'?'left':'right'}:-8px; width:22px; height:22px; border-radius:50%; background:var(--bad); color:#fff; border:2px solid var(--bg); font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;">✕</button>` : "";
      const cardHtml = `<div class="tcard ${isDone?'done':''}" style="transform:rotate(${rot}deg); position:relative;" onclick="${cardClick}">
          ${delBtn}
          <span class="nm">${it.name}</span>
          ${parkHint}
        </div>`;
      const badgeHtml = `<div class="tbadge" style="background:${badgeColor}" onclick="${editMode?'':`toggleItem('${key}')`}">${emoji}</div>`;
      html += `<div class="trow">
        <div class="side left">${side==='left'?cardHtml:''}</div>
        ${badgeHtml}
        <div class="side right">${side==='right'?cardHtml:''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  if(editMode){
    html += `<div style="display:flex; gap:8px; margin-top:16px;">
      <input id="newItemInput" placeholder="Adicionar item pra este dia..." style="flex:1; padding:11px 13px; border:1.5px solid var(--line2); border-radius:12px; font-family:var(--body); font-size:14px; background:#fff;">
      <button onclick="addDayItem('${day.date}')" style="background:var(--primary); color:#fff; border:none; width:46px; border-radius:12px; font-size:20px;">+</button>
    </div>`;
  }

  html += `</div>`;
  document.getElementById("screen-hoje").innerHTML = html;
}
function toggleEditMode(){
  editMode = !editMode;
  document.getElementById("editBtn").style.background = editMode ? "var(--accent)" : "rgba(255,255,255,.16)";
  renderHoje();
}
function removeDayItem(date, idx){
  const day = DAYS.find(d=>d.date===date);
  const arr = ensureCustom(day);
  arr.splice(idx,1);
  save("customItems", customItems);
  renderHoje();
}
function addDayItem(date){
  const input = document.getElementById("newItemInput");
  const name = input.value.trim();
  if(!name) return;
  const day = DAYS.find(d=>d.date===date);
  const arr = ensureCustom(day);
  arr.push({name, prio:1});
  save("customItems", customItems);
  renderHoje();
}
function changeDay(delta){
  currentDayIdx = Math.min(DAYS.length-1, Math.max(0, currentDayIdx+delta));
  renderHoje();
}
function toggleItem(key){
  doneItems[key] = !doneItems[key];
  save("done", doneItems);
  renderHoje();
}

/* ================= MAPA ================= */
function renderMapa(){
  document.getElementById("headerBody").innerHTML = `<div class="header-simple-title">🗺️ Nosso trajeto</div>`;
  const day = DAYS[findTodayIndex()];
  const currentNode = day.node;
  const stepY = 148, startY = 30;
  const totalH = startY + stepY*(ROUTE_NODES.length-1) + 90;

  let html = `<div class="inner"><div class="map-wrap" style="height:${totalH}px;">`;
  html += `<div class="blob" style="left:-40px; top:20px; width:170px; height:170px; background:#E8DFC3;"></div>`;
  html += `<div class="blob" style="right:-60px; top:${stepY*2.2}px; width:210px; height:210px; background:#DCE8DC;"></div>`;
  html += `<div class="blob" style="left:-50px; top:${stepY*5.4}px; width:190px; height:190px; background:#F0DCC8;"></div>`;

  // connecting path
  let d = "";
  ROUTE_NODES.forEach((n,i)=>{
    const x = n.x, y = startY + stepY*i;
    if(i===0) d += `M${x},${y} `;
    else {
      const prev = ROUTE_NODES[i-1];
      const py = startY + stepY*(i-1);
      const midx1 = (prev.x + (prev.x<x?20:-20));
      const midx2 = (x + (x<prev.x?20:-20));
      d += `C${midx1},${py+stepY*0.4} ${midx2},${y-stepY*0.4} ${x},${y} `;
    }
  });
  html += `<svg width="100%" height="${totalH}" viewBox="0 0 100 ${totalH}" preserveAspectRatio="none" style="position:absolute; left:0; top:0;">
    <path d="${d}" fill="none" stroke="#C9BE9E" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;

  ROUTE_NODES.forEach((n,i)=>{
    const y = startY + stepY*i;
    const isCurrent = i===currentNode;
    const isPast = i<currentNode;
    const size = isCurrent ? 58 : 42;
    html += `<div class="mstop ${isCurrent?'current':''}" style="left:calc(${n.x}% - ${size/2}px); top:${y-size/2}px; width:${size}px;">
      <div class="circ" style="width:${size}px; height:${size}px; background:${isCurrent?'var(--accent)':NODE_COLORS[i]}; font-size:${isCurrent?26:17}px; opacity:${isPast||isCurrent?1:.55};">
        ${n.emoji}
        ${isCurrent?'<div class="car">🚗</div>':''}
      </div>
      <div class="lbl">${n.label}</div>
      ${isCurrent?'<div class="here">📍 estamos aqui</div>':`<div style="font-size:9px; color:var(--muted);">${n.sub}</div>`}
    </div>`;
  });

  html += `</div></div>`;
  document.getElementById("screen-mapa").innerHTML = html;
}

/* ================= EXTRAS ================= */
let extrasFilter = "all";
function renderExtras(){
  document.getElementById("headerBody").innerHTML = `<div class="header-simple-title">✨ Extras</div>`;
  const cats = ["all","fastfood","passeio","outlet","outro"];
  let tabsHtml = cats.map(c=>`<button class="${extrasFilter===c?'active':''}" onclick="setExtrasFilter('${c}')">${c==='all'?'Todos':CAT_LABEL[c]}</button>`).join("");

  const groups = extrasFilter==="all" ? ["fastfood","passeio","outlet","outro"] : [extrasFilter];
  let bodyHtml = "";
  groups.forEach(cat=>{
    const list = extras.filter(e=>e.cat===cat);
    if(!list.length) return;
    const col = CAT_COLORS[cat];
    bodyHtml += `<div class="section-title">${CAT_LABEL[cat]}</div><div class="chip-group">`;
    list.forEach(e=>{
      const dayOptions = DAYS.map(d=>`<option value="${d.date}" ${e.day===d.date?'selected':''}>${fmtDate(d.date)}</option>`).join("");
      bodyHtml += `<div class="chip" style="background:${col.bg}; color:${col.fg};">
        <span>${e.emoji||'✨'} ${e.name}</span>
        <select onchange="setExtraDay('${e.id}', this.value)">
          <option value="">📅</option>
          ${dayOptions}
        </select>
      </div>`;
    });
    bodyHtml += `</div>`;
  });
  if(!bodyHtml) bodyHtml = `<div class="empty-note">Nada nessa categoria ainda</div>`;

  document.getElementById("screen-extras").innerHTML = `<div class="inner">
    <div class="extras-tabs">${tabsHtml}</div>
    ${bodyHtml}
  </div>`;
}
function setExtrasFilter(c){ extrasFilter=c; renderExtras(); }
function setExtraDay(id, day){
  const e = extras.find(x=>x.id===id);
  e.day = day || null;
  save("extras", extras);
  renderExtras();
}
function openAddExtra(){ document.getElementById("addExtraOverlay").classList.add("open"); }
function closeAddExtra(){ document.getElementById("addExtraOverlay").classList.remove("open"); }
function addExtra(){
  const name = document.getElementById("newExtraName").value.trim();
  if(!name) return;
  const cat = document.getElementById("newExtraCat").value;
  const emojiDefault = {fastfood:"🍔",passeio:"📍",outlet:"🏬",outro:"✨"}[cat];
  extras.push({id:"e"+Date.now(), name, cat, emoji:emojiDefault, day:null});
  save("extras", extras);
  document.getElementById("newExtraName").value="";
  closeAddExtra();
  renderExtras();
}

/* ================= FINANCEIRO ================= */
function renderFinanceiro(){
  document.getElementById("headerBody").innerHTML = `<div class="header-simple-title">💰 Gastos</div>`;
  const balances = {};
  PARTICIPANTS.forEach(p=>{ balances[p]={}; PARTICIPANTS.forEach(q=>{ if(p!==q) balances[p][q]=0; }); });
  expenses.forEach(exp=>{
    const share = exp.amount / PARTICIPANTS.length;
    PARTICIPANTS.forEach(p=>{
      if(p!==exp.payer){ balances[p][exp.payer] += share; balances[exp.payer][p] -= share; }
    });
  });

  let summaryHtml = "";
  PARTICIPANTS.forEach(p=>{
    let rows = "";
    PARTICIPANTS.forEach(q=>{
      if(p===q) return;
      const v = balances[p][q];
      if(Math.abs(v) < 0.005) return;
      if(v>0) rows += `<div class="balance-row"><span>Você deve pra <b>${q}</b></span><span class="amt neg">${money(v)}</span></div>`;
      else rows += `<div class="balance-row"><span><b>${q}</b> te deve</span><span class="amt pos">${money(-v)}</span></div>`;
    });
    if(rows) summaryHtml += `<div class="card"><div class="section-title">${p}</div>${rows}</div>`;
  });
  if(!summaryHtml) summaryHtml = `<div class="empty-note">Ninguém deve nada pra ninguém 🎉</div>`;

  let expHtml = expenses.slice().reverse().map(e=>`
    <div class="exp-item"><div><b>${e.payer}</b> pagou ${e.desc?('— '+e.desc):''}<div class="d">${fmtDate(e.date)}</div></div><div>${money(e.amount)}</div></div>
  `).join("") || `<div class="empty-note">Nenhum gasto registrado ainda</div>`;

  document.getElementById("screen-financeiro").innerHTML = `<div class="inner">
    <div class="card">
      <div class="section-title">Registrar gasto</div>
      <div class="field"><label>Quem pagou</label>
        <select id="expPayer">${PARTICIPANTS.map(p=>`<option>${p}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Valor (US$)</label><input type="number" step="0.01" id="expAmount" placeholder="0.00"></div>
      <div class="field"><label>Descrição (opcional)</label><input type="text" id="expDesc" placeholder="Ex: jantar, ingresso..."></div>
      <button class="btn" onclick="addExpense()">Adicionar gasto</button>
    </div>
    <div class="section-title" style="margin-top:6px;">Saldos</div>
    ${summaryHtml}
    <div class="section-title" style="margin-top:6px;">Histórico</div>
    <div class="card">${expHtml}</div>
  </div>`;
}
function addExpense(){
  const payer = document.getElementById("expPayer").value;
  const amount = parseFloat(document.getElementById("expAmount").value);
  const desc = document.getElementById("expDesc").value.trim();
  if(!amount || amount<=0) return;
  expenses.push({id:Date.now(), payer, amount, desc, date: todayStr()});
  save("expenses", expenses);
  renderFinanceiro();
}

function renderMemoria(){
  document.getElementById("headerBody").innerHTML = `<div class="header-simple-title">📸 Memória</div>`;
  const now = new Date();
  if(now < ALBUM_UNLOCK){
    document.getElementById("screen-memoria").innerHTML = `<div class="inner">
      <div class="card">
        <div class="section-title">Momento do dia</div>
        <div class="field"><label>Uma frase de hoje</label><textarea id="memText" placeholder="Como foi o dia de vocês?"></textarea></div>
        <div class="field"><label>Foto (opcional)</label><input type="file" accept="image/*" id="memPhoto"></div>
        <button class="btn" onclick="addMemory()">Guardar</button>
      </div>
      <div class="lock-screen">
        <div class="icon">🔒</div>
        <h3>Guardado com carinho</h3>
        <p>O álbum completo só destrava em <b>20 de novembro de 2026</b> — pra vocês reverem tudo de uma vez, com aquela sensação boa de nostalgia.</p>
      </div>
    </div>`;
  } else {
    const list = memories.slice().reverse().map(m=>`
      <div class="mem-entry">
        ${m.photo?`<img src="${m.photo}">`:''}
        <div class="dt">${fmtDate(m.date)}</div>
        <div class="txt">${m.text}</div>
      </div>
    `).join("") || `<div class="empty-note">Nenhuma memória guardada</div>`;
    document.getElementById("screen-memoria").innerHTML = `<div class="inner"><h2 style="font-size:19px; color:var(--primary); margin-bottom:14px;">📖 Álbum da viagem</h2>${list}</div>`;
  }
}
function addMemory(){
  const text = document.getElementById("memText").value.trim();
  const fileInput = document.getElementById("memPhoto");
  if(!text) return;
  const finish = (photoDataUrl)=>{
    memories.push({date:todayStr(), text, photo:photoDataUrl||null});
    save("memories", memories);
    document.getElementById("memText").value="";
    renderMemoria();
  };
  if(fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=> finish(reader.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else { finish(null); }
}

function renderDocs(){
  const q = (document.getElementById("docSearch").value||"").toLowerCase();
  const today = todayStr();
  let sorted = DOCS.slice().sort((a,b)=> a.date.localeCompare(b.date));
  let html = sorted.filter(d=>{
    if(!q) return true;
    return d.cat.toLowerCase().includes(q) || d.rows.join(" ").toLowerCase().includes(q);
  }).map(d=>{
    const isToday = d.date<=today && (sorted.filter(x=>x.date<=today).slice(-1)[0]===d);
    return `<div class="doc-block ${isToday?'today':''}">
      <div class="dtitle">${d.cat} ${isToday?'<span class="today-flag">ATUAL</span>':''}</div>
      ${d.rows.map(r=>`<div class="drow">${r}</div>`).join("")}
    </div>`;
  }).join("");
  document.getElementById("docsList").innerHTML = html || `<div class="empty-note">Nada encontrado</div>`;
}

}
